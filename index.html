<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nigeria Climate Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="app-top">
    <span class="app-name">Nigeria Climate Forecast</span>
    <span class="app-tag">LSTM model &middot; trained on 1980&ndash;2025</span>
  </div>

  <div class="zone-select" id="zoneGrid">
    <button class="zone-btn active" data-zone="nigeria">Nigeria</button>
    <button class="zone-btn" data-zone="Tropical_Monsoon">Monsoon</button>
    <button class="zone-btn" data-zone="Tropical_Savannah">Savannah</button>
    <button class="zone-btn" data-zone="Tropical_Dry_Sahel">Sahel</button>
    <button class="zone-btn" data-zone="Montane">Montane</button>
  </div>

  <div class="card">
    <div class="card-top">
      <div class="var-select" id="varToggle">
        <button class="var-btn active" data-var="temp">Temperature</button>
        <button class="var-btn" data-var="rain">Rainfall</button>
      </div>
      <span class="asof" id="asOf"></span>
    </div>

    <div class="chart-area">
      <canvas id="forecastChart"></canvas>
    </div>

    <p class="caption" id="caption"></p>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
